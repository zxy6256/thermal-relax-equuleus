# thermal-engine.conf —— SDM845 / equuleus 结构与取值都对齐原厂风格的测试样本
# 用途: tests/run_tests.sh 的输入，用于验证 patch_conf.awk 的放宽逻辑
# 注意: 这是合成样本，不是从设备上抓下来的真实文件

[SS-APC0]
algo_type ss
sampling 1000
desc "little cluster step_wise"
sensor cpu-0-0-usr
thresholds 60000 65000 70000 75000 80000
thresholds_clr 58000 63000 68000 73000 78000
actions cpu
action_info 1478400 1209600 998400 787200 576000

[SS-APC1]
algo_type ss
sampling 1000
desc "big cluster step_wise"
sensor cpu-1-0-usr
thresholds 62000 67000 72000 77000 82000
thresholds_clr 60000 65000 70000 75000 80000
actions cpu
action_info 1900800 1612800 1324800 1056000 825600

[SS-GPU]
algo_type ss
sampling 1000
sensor gpuss-0-usr
thresholds 60000 65000 70000
thresholds_clr 58000 63000 68000
actions gpu
action_info 430000000 342000000 257000000

[SS-SKIN]
algo_type monitor
sampling 1000
sensor quiet-therm
thresholds 38000 40000 42000
thresholds_clr 37000 39000 41000
actions cpu
action_info 1612800 1209600 998400

[HOTPLUG-CPU]
algo_type monitor
sampling 2000
sensor cpu-1-0-usr
thresholds 70000 75000 78000
thresholds_clr 68000 73000 76000
actions hotplug
action_info 1 2 3

[BATTERY]
algo_type monitor
sampling 5000
sensor battery
thresholds 45000 50000 55000
thresholds_clr 44000 49000 54000
actions battery
action_info 1 2 3

[CHG-THERM]
algo_type monitor
sampling 5000
sensor chg-therm
thresholds 40000 45000
thresholds_clr 39000 44000
actions chg
action_info 1 2

[SHUTDOWN]
algo_type monitor
sampling 1000
sensor cpu-1-0-usr
thresholds 95000 100000
thresholds_clr 0 0
actions shutdown
action_info 1 1
