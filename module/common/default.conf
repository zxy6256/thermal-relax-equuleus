# ThermalRelax 用户配置（首次启动自动复制到 /data/adb/thermal-relax/config.conf）
# 改完用 `thermalctl` 重新应用： thermalctl apply   或重启
# 所有温度单位：毫摄氏度（49000 = 49.0°C）

# ---- 配置版本：升级模块时会用新版默认值覆盖（保留你自己的改动请另存 config.local） ----
CONF_VERSION=10000

# ========== 1. 阈值放宽 ==========
# 对 vendor 温控配置里的 thresholds / thresholds_clr 整体上抬的度数（毫摄氏度）
# 8000 = +8°C。原厂 skin 阈值常在 38~42°C，握手里就常态触发，这就是"低负载也掉频"的根源。
DELTA_MC=8000
# 阈值上限（毫摄氏度）：抬到这条线就截断，避免把整条保护曲线推过硬件 LMH（~95°C）
# 84°C 是刻意选的：软件降频梯子最高一段落在 84°C，看门狗在 86°C 强制回滚，硬件 LMH 再兜一层
MAX_MC=84000
# 安全组传感器（电池/充电/功放）永远不抬阈值，写在这里只是给巡检脚本看，不用改
SAFE_SENSORS="batt|ibat|vbat|chg|usb|pa-therm|pa_therm|pm8|pm_|bcl|smb|dc-therm"

# ========== 2. 降频下限 ==========
# 温控 mitigation 时允许压到的最低频率（kHz）。原厂 sdm845 配置会一路压到 825600/576000，
# 那就是 UI 卡顿的直接来源。A75 簇 1.2GHz、A55 簇 1.4GHz 是能效/流畅的平衡点。
CPU0_FLOOR_KHZ=1401600
CPU1_FLOOR_KHZ=1209600
# GPU 频率下限（Hz），0 = 不改 GPU 的 action_info
GPU_FLOOR_HZ=0
# 核心热插拔：1 = 把前几档的"关核数"压到最多 1 个（最后一档保留原样，留一手兜底）；0 = 不动
HOTPLUG_RELAX=1

# ========== 3. 调度/boost（解决"偶发卡顿"的第二只手） ==========
# schedutil 上调速率限制（µs）。原厂 20000 意味着最快 50Hz 才评估一次升降频，起手就迟。
SCHEDUTIL_RATE_US=5000
# hispeed_freq：负载越过阈值时直接跳到的频率（kHz）
HISPEED_POLICY0=1401600
HISPEED_POLICY4=1804800
# 大核簇 core_ctl 最少保持在线核心数（1~4）。1 会让大核簇反复 power collapse，唤醒延迟大
CORE_CTL_MIN_BIG=2
# 触控/输入 boost（仅在存在 cpu_boost 模块时生效），0 = 不干预
INPUT_BOOST_MS=500

# ========== 4. 安全兜底（触发即回滚原厂配置） ==========
# SoC 结温（*-usr）达到此值连续 2 个采样周期 -> 回滚 + 冷却 30 分钟
GUARD_HOT_MC=80000
# SoC 结温达到此值 -> 立即回滚（不等第二个周期）
GUARD_CRIT_MC=86000
# 电池温度超过此值 -> 立即回滚
BATT_HOT_MC=45000
# 冷却到此温度以下并稳定 60 秒 -> 重新放宽
GUARD_COOL_MC=55000
# 采样周期（秒）
POLL_SEC=10
# 回滚后的冷却时长（秒）
COOLDOWN_SEC=1800

# ========== 5. 运行模式 ==========
# relaxed = 放宽 / stock = 原厂（改了之后 thermalctl apply 生效）
PROFILE=relaxed
